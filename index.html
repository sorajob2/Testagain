<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจองคิวตู้คอนเทนเนอร์</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
<h2>📦 ระบบจองคิวตู้คอนเทนเนอร์</h2>

<form id="bookingForm">

<label>ชื่อบริษัท</label>
<input type="text" name="company" required>

<label>ชื่อผู้ติดต่อ</label>
<input type="text" name="contact" required>

<label>เบอร์โทร</label>
<input type="text" name="phone" required>

<label>ทะเบียนหน้ารถ</label>
<input type="text" name="front_plate" required>

<label>ทะเบียนหลังรถ</label>
<input type="text" name="back_plate" required>

<label>หมายเลขตู้</label>
<input type="text" name="container_no" required>

<label>สายเรือ</label>
<input type="text" name="shipping_line" required>

<label>วันที่จอง</label>
<input type="date" id="date" name="date" required>

<label>ช่วงเวลา</label>
<select id="time" name="time" required>
  <option value="">เลือกช่วงเวลา</option>

  <option>08:00</option>
  <option>08:15</option>
  <option>08:30</option>
  <option>08:45</option>

  <option>09:00</option>
  <option>09:15</option>
  <option>09:30</option>
  <option>09:45</option>

  <option>10:00</option>
  <option>10:15</option>
  <option>10:30</option>
  <option>10:45</option>

  <option>11:00</option>
  <option>11:15</option>
  <option>11:30</option>
  <option>11:45</option>

  <option>12:00</option>
  <option>12:15</option>
  <option>12:30</option>
  <option>12:45</option>

  <option>13:00</option>
  <option>13:15</option>
  <option>13:30</option>
  <option>13:45</option>

  <option>14:00</option>
  <option>14:15</option>
  <option>14:30</option>
  <option>14:45</option>

  <option>15:00</option>
  <option>15:15</option>
  <option>15:30</option>
  <option>15:45</option>

  <option>16:00</option>
  <option>16:15</option>
  <option>16:30</option>
  <option>16:45</option>
</select>

<label>หมายเหตุ</label>
<textarea name="note"></textarea>

<button type="submit">🚚 จองคิว</button>

<div class="success" id="successMsg">
  ✅ จองคิวสำเร็จ!
</div>

</form>
</div>

<script src="script.js"></script>
</body>
</html>
